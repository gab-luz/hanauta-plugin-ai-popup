name: lint

on:
  push:
  pull_request:

jobs:
  ruff:
    name: undefined names + redefinitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade ruff

      - name: Lint (F821 undefined names, F811 redefinitions, E9 syntax)
        run: ruff check .

      - name: Byte-compile the package
        run: python -m compileall -q hanauta_aipopup skills

  tests:
    name: pytest
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q
